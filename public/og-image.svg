      </text>
    </g>

    <!-- Direct Contact Links -->
    <g transform="translate(680, 0)">
      <text x="0" y="22" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="700" fill="#A7F3D0">
        WhatsApp: +57 302 310 5047 · ruzae1@gmail.com
      </text>
    </g>
  </g>
</svg>
