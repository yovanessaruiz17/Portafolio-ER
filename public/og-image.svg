<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D0B4E" />
      <stop offset="45%" stop-color="#4B197A" />
      <stop offset="100%" stop-color="#1F0736" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6D32A5" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#4B197A" stop-opacity="0.15" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9047DE" />
      <stop offset="100%" stop-color="#6D32A5" />
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9047DE" />
      <stop offset="50%" stop-color="#6D32A5" />
      <stop offset="100%" stop-color="#4B197A" />
    </linearGradient>
    <radialGradient id="glow1" cx="85%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#9047DE" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#4B197A" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="15%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#6D32A5" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#2D0B4E" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Ambient Lighting -->
  <circle cx="1020" cy="130" r="380" fill="url(#glow1)" />
  <circle cx="180" cy="540" r="340" fill="url(#glow2)" />

  <!-- Subtle Grid Accent -->
  <g stroke="#F0E7FC" stroke-opacity="0.04" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="630" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="320" y1="0" x2="320" y2="630" />
    <line x1="440" y1="0" x2="440" y2="630" />
    <line x1="560" y1="0" x2="560" y2="630" />
    <line x1="680" y1="0" x2="680" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="920" y1="0" x2="920" y2="630" />
    <line x1="1040" y1="0" x2="1040" y2="630" />
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="330" x2="1200" y2="330" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="570" x2="1200" y2="570" />
