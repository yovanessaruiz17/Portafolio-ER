  <!-- Top Accent Line -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#badgeGrad)" />

  <!-- Trajectory Pill -->
  <g transform="translate(80, 58)">
    <rect width="430" height="36" rx="18" fill="#F0E7FC" fill-opacity="0.15" stroke="#9047DE" stroke-width="1.5" />
    <circle cx="22" cy="18" r="6" fill="#10B981" />
    <text x="36" y="23" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#F0E7FC" letter-spacing="0.5">
      TRAYECTORIA EN SALUD Y SECTOR COMERCIAL
    </text>
  </g>

  <!-- Main Professional Identity -->
  <text x="80" y="162" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" fill="#FFFFFF" letter-spacing="-1">
    Eber Ruiz Zamora
  </text>
  <text x="80" y="210" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#E2C9FC">
    Ingeniero de Sistemas · 20+ Años de Experiencia
  </text>

  <!-- Core Services Cards Grid -->
  <g transform="translate(80, 240)">
    <!-- Service Card 1: Excel & Power Query -->
    <g transform="translate(0, 0)">
      <rect width="330" height="96" rx="16" fill="url(#cardGrad)" stroke="#6D32A5" stroke-opacity="0.4" stroke-width="1" />
      <text x="20" y="38" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">
