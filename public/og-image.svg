    <!-- Service Card 2: Power BI & SQL -->
    <g transform="translate(350, 0)">
      <rect width="330" height="96" rx="16" fill="url(#cardGrad)" stroke="#6D32A5" stroke-opacity="0.4" stroke-width="1" />
      <text x="20" y="38" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">
        Power BI &amp; SQL
      </text>
      <text x="20" y="66" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="400" fill="#E9D8FD">
        Tableros dinámicos y analítica
      </text>
    </g>

    <!-- Service Card 3: Inventarios Farmacias -->
    <g transform="translate(0, 112)">
      <rect width="330" height="96" rx="16" fill="url(#cardGrad)" stroke="#6D32A5" stroke-opacity="0.4" stroke-width="1" />
      <text x="20" y="38" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">
        Inventarios Farmacéuticos
      </text>
      <text x="20" y="66" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="400" fill="#E9D8FD">
        Semaforización y control de lotes
      </text>
    </g>

    <!-- Service Card 4: Soporte y Mantenimiento -->
    <g transform="translate(350, 112)">
      <rect width="330" height="96" rx="16" fill="url(#cardGrad)" stroke="#6D32A5" stroke-opacity="0.4" stroke-width="1" />
      <text x="20" y="38" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">
        Soporte &amp; Mantenimiento
      </text>
      <text x="20" y="66" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="400" fill="#E9D8FD">
        Diagnóstico, optimización y redes
      </text>
    </g>
  </g>

  <!-- Right Visual Monogram Card -->
  <g transform="translate(830, 130)">
    <!-- Outer Card Frame -->
    <rect width="290" height="350" rx="28" fill="#1B072F" stroke="#9047DE" stroke-opacity="0.3" stroke-width="1.5" />

    <!-- Avatar Inner -->
    <g transform="translate(70, 40)">
      <rect width="150" height="150" rx="32" fill="url(#avatarGrad)" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="3" />
      <text x="75" y="98" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="64" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
        ER
      </text>
    </g>

    <!-- Badge Info in Card -->
    <text x="145" y="235" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      Eber Ruiz Zamora
